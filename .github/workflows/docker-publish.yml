name: Docker Build and Publish

on:
  push:
    branches: ["master", "new-dev", "zaoguang"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Verify custom release source gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test_count=0
          for test_file in tests/*.test.js; do
            test -f "$test_file"
            echo "[source-gate] $test_file"
            node "$test_file"
            test_count=$((test_count + 1))
          done
          test "$test_count" -gt 0

      - name: Verify packaged admin icon assets
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 public/assets/admin/scripts/check_admin_icon_visibility.py
          bundle_count=0
          for admin_bundle in public/assets/admin/assets/index-*.js; do
            test -f "$admin_bundle"
            node --check "$admin_bundle"
            bundle_count=$((bundle_count + 1))
          done
          test "$bundle_count" -gt 0

      - name: Set up PHP test runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, mbstring, pcntl, pdo_sqlite, redis, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP test dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run standalone PHP source smoke checks
        shell: bash
        run: |
          set -Eeuo pipefail

          run_smoke() {
            local smoke_file="$1"
            echo "::group::[php-source-smoke] ${smoke_file}"
            if php "$smoke_file"; then
              echo "::endgroup::"
              return 0
            else
              local status=$?
              echo "::endgroup::"
              echo "::error file=${smoke_file}::PHP source smoke failed with exit code ${status}"
              return "$status"
            fi
          }

          run_smoke tests/smoke-node-access-url.php
          run_smoke tests/smoke-luck-theme-patches.php
          run_smoke tests/smoke-custom-backend.php

      - name: Run PHP unit and feature regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0600 /dev/null database/testing.sqlite
          vendor/bin/phpunit --configuration phpunit.xml --do-not-cache-result
          rm -f database/testing.sqlite

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          driver-opts: |
            image=moby/buildkit:v0.20.0
            network=host

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: get_version
        shell: bash
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u '+%Y%m%d')-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Extract unique smoke-candidate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Extract tested release tags
        id: release-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=sha,format=short,prefix=,enable=true
            type=sha,format=long,prefix=,enable=true
            type=raw,value=${{ steps.get_version.outputs.version }}
            type=ref,event=branch
            type=raw,value=new,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push unique smoke candidate
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BUILDKIT_MULTI_PLATFORM=1
            CACHEBUST=${{ github.sha }}
            SOURCE_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.get_version.outputs.version }}
          provenance: false
          outputs: type=registry,push=true
          allow: |
            network.host

      - name: Smoke test published image
        shell: bash
        run: |
          set -Eeuo pipefail
          # Docker repository names are lowercase even when github.repository
          # preserves the owner's display casing.
          SMOKE_IMAGE="$(printf '%s' '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}' | tr '[:upper:]' '[:lower:]')"
          bash .docker/ci-smoke.sh "$SMOKE_IMAGE"

      - name: Publish tested release tags
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
          RELEASE_TAGS: ${{ steps.release-meta.outputs.tags }}
        run: |
          set -Eeuo pipefail
          IMAGE_REF="$(printf '%s' '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          SMOKE_IMAGE="${IMAGE_REF}:candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          SMOKED_DIGEST="$(docker buildx imagetools inspect "$SMOKE_IMAGE" --format '{{json .Manifest}}' | jq -er '.digest')"
          test "$SMOKED_DIGEST" = "$IMAGE_DIGEST"
          release_tag_count=0
          while IFS= read -r release_tag; do
            [ -n "$release_tag" ] || continue
            release_tag="$(printf '%s' "$release_tag" | tr '[:upper:]' '[:lower:]')"
            docker buildx imagetools create \
              --tag "$release_tag" \
              "${IMAGE_REF}@${IMAGE_DIGEST}"
            release_tag_count=$((release_tag_count + 1))
          done <<< "$RELEASE_TAGS"
          expected_release_tag_count=4
          if [ '${{ github.ref }}' = 'refs/heads/master' ]; then
            expected_release_tag_count=6
          fi
          test "$release_tag_count" -eq "$expected_release_tag_count"

